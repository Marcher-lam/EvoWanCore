[project]
name = "examples"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ['agent-core', 'agent-explore', 'agent-evolve', 'agent-adapters', 'Pillow>=10']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examples"]

[tool.uv.sources]
agent-core = { workspace = true }
agent-explore = { workspace = true }
agent-evolve = { workspace = true }
agent-adapters = { workspace = true }
