[project]
name = "agent-adapters"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ['agent-core', 'httpx>=0.27', 'openai>=1.50', 'websockets>=13']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_adapters"]

[tool.uv.sources]
agent-core = { workspace = true }
