[project]
name = "agent-evolve"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ['agent-core']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evolve"]

[tool.uv.sources]
agent-core = { workspace = true }
