name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（root 依赖已带 agent-adapters[browser]）
        run: uv sync

      - name: 安装 chromium（真浏览器 CUA 测试）
        run: uv run playwright install --with-deps chromium

      - name: Lint（ruff）
        run: uv run ruff check .

      - name: 全量测试（349+，含真 chromium / A2A / SSE / resume）
        run: uv run pytest -q

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv（smoke 需要 Python server）
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python 依赖
        run: uv sync

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-sdk-ts/package.json

      - name: 安装 TS 依赖
        working-directory: agent-sdk-ts
        run: npm install

      - name: 类型检查 + 构建
        working-directory: agent-sdk-ts
        run: npx tsc -p tsconfig.json

      - name: 冒烟 e2e（对真 Python server）
        working-directory: agent-sdk-ts
        run: node smoke/run.mjs
